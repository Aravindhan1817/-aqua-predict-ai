services:
  - type: web
    name: aqua-predict-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/water_quality.db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: water-data
      mountPath: /var/data
      sizeGB: 1
